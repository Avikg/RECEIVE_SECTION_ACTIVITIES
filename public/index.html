<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBSEDCL Receive Section</title>
<style>
  :root {
    --primary:#1a56db; --primary-dark:#1e429f; --success:#0e9f6e;
    --warning:#c27803; --danger:#e02424; --bg:#f3f4f6; --card:#fff;
    --text:#111827; --muted:#6b7280; --border:#e5e7eb;
    --sidebar:#1e3a8a; --sidebar-text:#bfdbfe; --sidebar-active:#3b82f6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* LOGIN */
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a8a,#1a56db);}
  .login-box{background:#fff;border-radius:16px;padding:40px 48px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .login-box .logo{text-align:center;margin-bottom:28px;}
  .login-box .logo h1{color:var(--primary-dark);font-size:22px;font-weight:800;}
  .login-box .logo p{color:var(--muted);font-size:13px;margin-top:4px;}
  #login-error{color:var(--danger);font-size:13px;margin-bottom:12px;display:none;background:#fef2f2;padding:8px 12px;border-radius:6px;border:1px solid #fecaca;}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;}
  .btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-dark);}
  .btn-success{background:var(--success);color:#fff;} .btn-success:hover{background:#057a55;}
  .btn-danger{background:var(--danger);color:#fff;}   .btn-danger:hover{background:#c81e1e;}
  .btn-warning{background:#f59e0b;color:#fff;}        .btn-warning:hover{background:var(--warning);}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);} .btn-outline:hover{background:var(--bg);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-full{width:100%;justify-content:center;}

  /* FORMS */
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;transition:border .2s;font-family:inherit;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);}
  .form-group textarea{resize:vertical;min-height:80px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  /* LAYOUT */
  #app{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:240px;background:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;flex-shrink:0;}
  .sidebar-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar-header h2{color:#fff;font-size:14px;font-weight:800;line-height:1.3;}
  .sidebar-header p{color:var(--sidebar-text);font-size:11px;margin-top:2px;}
  .sidebar-user{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar-user .user-name{color:#fff;font-size:13px;font-weight:600;}
  .sidebar-user .user-role{color:var(--sidebar-text);font-size:11px;}
  .sidebar-nav{flex:1;padding:12px 8px;}
  .nav-section{color:rgba(255,255,255,.4);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 4px;margin-top:8px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--sidebar-text);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;}
  .nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;}
  .nav-item .icon{font-size:16px;width:20px;text-align:center;}
  .sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);}
  .btn-logout{background:rgba(255,255,255,.1);color:#fff;width:100%;justify-content:center;font-size:13px;padding:8px;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn-logout:hover{background:rgba(255,255,255,.2);}

  /* MAIN */
  .main{flex:1;overflow-x:hidden;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .topbar-title{font-size:18px;font-weight:700;}
  .breadcrumb{font-size:12px;color:var(--muted);margin-top:1px;}
  .content{padding:24px;}

  /* CARDS */
  .card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;}
  .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-header h3{font-size:15px;font-weight:700;}
  .card-body{padding:20px;}

  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:#fff;border-radius:12px;padding:20px;border:1px solid var(--border);}
  .stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .stat-value{font-size:28px;font-weight:800;margin-top:6px;}
  .stat-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .blue .stat-value{color:var(--primary);} .green .stat-value{color:var(--success);}
  .orange .stat-value{color:var(--warning);} .red .stat-value{color:var(--danger);}

  /* TABLE */
  .table-wrapper{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:#f9fafb;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f9fafb;}

  /* BADGES */
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge-blue{background:#dbeafe;color:#1e40af;} .badge-green{background:#d1fae5;color:#065f46;}
  .badge-orange{background:#fef3c7;color:#92400e;} .badge-red{background:#fee2e2;color:#991b1b;}
  .badge-gray{background:#f3f4f6;color:#374151;} .badge-purple{background:#ede9fe;color:#5b21b6;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
  .modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-header h3{font-size:16px;font-weight:700;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;}
  .modal-body{padding:24px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

  /* MISC */
  .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .alert-error{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;}
  .alert-success{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;}
  .empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
  .empty-state .icon{font-size:40px;margin-bottom:12px;}
  .empty-state p{font-size:14px;}
  .filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filter-bar input,.filter-bar select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;}
  .filter-bar input:focus,.filter-bar select:focus{border-color:var(--primary);}
  .days-ok{color:var(--success);font-weight:700;} .days-warn{color:var(--warning);font-weight:700;} .days-over{color:var(--danger);font-weight:700;}
  .days-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .days-pill.ok{background:#d1fae5;color:#065f46;}
  .days-pill.warn{background:#fef3c7;color:#92400e;}
  .days-pill.over{background:#fee2e2;color:#991b1b;}
  .act-tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-2px;}
  .act-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  .act-tab:hover{color:var(--primary);}
  .trail-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .trail-item:last-child{border-bottom:none;}
  .trail-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:3px;flex-shrink:0;}
  .trail-action{font-weight:700;color:var(--primary);}
  .trail-detail{color:var(--muted);margin-top:1px;font-size:12px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>WBSEDCL</h1>
      <p>Receive Section Management System</p>
    </div>
    <div class="login-divider"></div>
    <div id="login-error"></div>
    <div class="form-group"><label>Username</label><input id="l-user" placeholder="Enter username" autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input type="password" id="l-pass" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header"><h2>⚡ WBSEDCL</h2><p>Receive Section</p></div>
      <div class="sidebar-user">
        <div class="user-name" id="sb-name">–</div>
        <div class="user-role" id="sb-role">–</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer" id="sidebar-footer">
        <button id="btn-backup" class="btn-logout" onclick="downloadBackup()" style="display:none;margin-bottom:6px;background:rgba(79,70,229,.25);border:1px solid rgba(79,70,229,.4);color:#c7d2fe;">💾 Backup DB</button>
        <button class="btn-logout" onclick="doLogout()">🚪 Logout</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div>
          <div class="topbar-title" id="page-title">Dashboard</div>
          <div class="breadcrumb" id="page-breadcrumb">Home</div>
        </div>
      </div>
      <div class="content" id="page-content"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
const API = '';
let token = localStorage.getItem('wbsedcl_token');
let currentUser = null;
let allSections = [];

// ── HELPERS ──────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function loading() {
  return `<div style="text-align:center;padding:40px;color:#6b7280">
    <div style="font-size:32px;margin-bottom:8px">⏳</div>Loading...</div>`;
}
function empty(icon, msg) {
  return `<div style="text-align:center;padding:48px;color:#9ca3af">
    <div style="font-size:40px;margin-bottom:12px">${icon}</div>
    <div style="font-size:15px">${esc(msg)}</div></div>`;
}
function errBox(msg) {
  return `<div class="alert alert-error" style="margin:20px">
    <strong>Error:</strong> ${esc(msg)}</div>`;
}

function fmtDate(d) {
  if (!d) return '–';
  return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDT(d) {
  if (!d) return '–';
  return new Date(d).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function daysClass(n) { return n <= 2 ? 'days-ok' : n <= 4 ? 'days-warn' : 'days-over'; }
function daysStr(n) { return n === 0 ? 'Today' : n === 1 ? '1 day' : n + ' days'; }
function daysPill(n) {
  const cls = n <= 2 ? 'ok' : n <= 4 ? 'warn' : 'over';
  const icon = n <= 2 ? '✅' : n <= 4 ? '⚠️' : '🔴';
  const label = n === 0 ? 'Today' : n === 1 ? '1 day' : n + ' days';
  return `<span class="days-pill ${cls}">${icon} ${label}</span>`;
}

function typeBadge(t) {
  const m = { Notesheet: 'badge-blue', Bill: 'badge-green', Letter: 'badge-orange' };
  return `<span class="badge ${m[t] || 'badge-gray'}">${t}</span>`;
}
function statusBadge(s) {
  const m = { Active: 'badge-green', Closed: 'badge-gray', Archived: 'badge-purple' };
  return `<span class="badge ${m[s] || 'badge-gray'}">${s}</span>`;
}
function roleBadge(r) {
  const m = { admin: 'badge-red', head: 'badge-blue', sectional: 'badge-gray' };
  const l = { admin: 'Admin', head: 'Head', sectional: 'Sectional' };
  return `<span class="badge ${m[r] || 'badge-gray'}">${l[r] || r}</span>`;
}

function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = type==='error'?'linear-gradient(135deg,#dc2626,#ef4444)':'linear-gradient(135deg,#059669,#10b981)';
  t.style.cssText = 'position:fixed;top:20px;right:20px;z-index:9999;min-width:260px;box-shadow:0 4px 20px rgba(0,0,0,.15)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function openModal(title, body, footer) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer || '';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

// ── AUTH ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try {
    const data = await api('POST', '/api/auth/login', { username, password });
    token = data.token;
    localStorage.setItem('wbsedcl_token', token);
    localStorage.setItem('wbsedcl_session', data.session_id || '');
    currentUser = data.user;
    await initApp();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') doLogin();
});
function doLogout() {
  const sid = localStorage.getItem('wbsedcl_session');
  if (token) {
    api('POST', '/api/auth/logout', { session_id: sid ? Number(sid) : null }).catch(()=>{});
  }
  localStorage.removeItem('wbsedcl_token');
  localStorage.removeItem('wbsedcl_session');
  token = null; currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function initApp() {
  try {
    currentUser = await api('GET', '/api/auth/me');
    allSections = await api('GET', '/api/sections');
  } catch { doLogout(); return; }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sb-name').textContent = currentUser.name;
  document.getElementById('sb-role').textContent =
    currentUser.role === 'admin' ? 'Administrator' :
    currentUser.role === 'head' ? 'Head – ' + currentUser.section_name :
    currentUser.section_name || 'Sectional';
  buildNav();
  if (currentUser.role === 'admin') {
    const b = document.getElementById('btn-backup');
    if (b) b.style.display = 'flex';
  }
  navigate('dashboard');
}

// ── NAV ──────────────────────────────────────────────────────────────────────
const NAV = [
  { id: 'dashboard', icon: '🏠', label: 'Dashboard',          roles: ['admin','head','sectional'] },
  { id: 'my-docs',   icon: '📄', label: 'My Documents',       roles: ['admin','head','sectional'] },
  { id: 'receive',   icon: '📥', label: 'Receive Document',   roles: ['admin','head','sectional'] },
  { id: 'search',    icon: '🔍', label: 'Search',             roles: ['admin','head','sectional'] },
  { id: 'reports',   icon: '📊', label: 'Reports',            roles: ['admin','head','sectional'] },
  { section: 'Administration', roles: ['admin'] },
  { id: 'users',     icon: '👥', label: 'User Management',    roles: ['admin'] },
  { id: 'sections',  icon: '🏢', label: 'Section Management', roles: ['admin'] },
  { id: 'activity',  icon: '🕐', label: 'Activity Log',       roles: ['admin'] },
  { id: 'export',    icon: '📤', label: 'Export to Excel',    roles: ['admin','head','sectional'] },
  { id: 'contractors', icon: '🏢', label: 'Contractor Mgmt',    roles: ['admin'] },
];
const PAGE_TITLES = {
  dashboard: 'Dashboard', 'my-docs': 'My Documents', receive: 'Receive Document',
  search: 'Search Documents', reports: 'Reports', users: 'User Management',
  sections: 'Section Management', activity: 'Activity Log', export: 'Export to Excel', contractors: 'Contractor Management'
};

function buildNav() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  NAV.forEach(item => {
    if (!item.roles.includes(currentUser.role)) return;
    if (item.section) {
      nav.innerHTML += `<div class="nav-section">${item.section}</div>`;
    } else {
      nav.innerHTML += `<div class="nav-item" id="nav-${item.id}" onclick="navigate('${item.id}')">
        <span class="icon">${item.icon}</span>${item.label}</div>`;
    }
  });
}

function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const el = document.getElementById('nav-' + page);
  if (el) el.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  document.getElementById('page-breadcrumb').textContent = 'Home › ' + (PAGE_TITLES[page] || page);
  const PAGES = {
    dashboard: renderDashboard, 'my-docs': renderMyDocs, receive: renderReceive,
    search: renderSearch, reports: renderReports, users: renderUsers,
    sections: renderSections, activity: renderActivity, export: renderExport, contractors: renderContractors
  };
  if (PAGES[page]) PAGES[page]();
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function currentUserIsReceive() {
  return (currentUser.section_name || '').toLowerCase().includes('receive');
}
const ALL_DOCS_PAGE_SIZE = 10;
window._allActiveDocs = [];
window._allActivePage = 1;

function renderAllActiveTable() {
  const docs = window._allActiveDocs;
  const page = window._allActivePage;
  const total = docs.length;
  const pages = Math.max(1, Math.ceil(total / ALL_DOCS_PAGE_SIZE));
  const start = (page - 1) * ALL_DOCS_PAGE_SIZE;
  const slice = docs.slice(start, start + ALL_DOCS_PAGE_SIZE);
  const isReceive = currentUserIsReceive();

  const docRow = (d) => `<tr>
    <td><strong>${esc(d.doc_number)}</strong></td>
    <td>${typeBadge(d.doc_type)}</td>
    <td>${esc(d.subject)}</td>
    <td>${esc(d.holder_name || '–')}</td>
    <td>${esc(d.current_section_name || '–')}</td>
    <td>${fmtDate(d.received_date)}</td>
    <td>${daysPill(d.days_with_holder)}</td>
    <td style="display:flex;gap:4px">
      <button class="btn btn-primary btn-sm" onclick="showTransferModal(${d.id},'${esc(d.doc_number)}')">↗ Route</button>
      <button class="btn btn-outline btn-sm" onclick="showDocDetail(${d.id})">View</button>
    </td></tr>`;

  const pagination = pages <= 1 ? '' : `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);font-size:13px;background:#f9fafb">
      <span style="color:var(--muted)">Showing ${start+1}–${Math.min(start+ALL_DOCS_PAGE_SIZE,total)} of ${total}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="setAllActivePage(${page-1})" ${page===1?'disabled':''}>← Prev</button>
        ${Array.from({length:pages},(_,i)=>`<button class="btn btn-sm ${i+1===page?'btn-primary':'btn-outline'}" onclick="setAllActivePage(${i+1})">${i+1}</button>`).join('')}
        <button class="btn btn-outline btn-sm" onclick="setAllActivePage(${page+1})" ${page===pages?'disabled':''}>Next →</button>
      </div>
    </div>`;

  const el = document.getElementById('all-active-body');
  if (!el) return;
  if (total === 0) {
    el.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted)">📭 No active documents in the system</td></tr>`;
  } else {

async function renderMyDocs() {
  const C = document.getElementById('page-content');
  C.innerHTML = loading();
  try {
    const docs = await api('GET', '/api/documents?mine=true');
    window._myDocs = docs;
    C.innerHTML = `
      <div class="filter-bar">
        <input type="text" id="md-q" placeholder="Search..." onkeyup="filterMyDocs()" style="flex:1;min-width:160px">
        <select id="md-type" onchange="filterMyDocs()">
          <option value="">All Types</option><option>Notesheet</option><option>Bill</option><option>Letter</option>
        </select>
        <select id="md-status" onchange="filterMyDocs()">
          <option value="">All Status</option><option>Active</option><option>Closed</option><option>Archived</option>
        </select>
      </div>
      <div class="card"><div class="card-header"><h3>📄 My Documents (${docs.length})</h3></div>
        <div class="table-wrapper" id="md-table">${docsTable(docs)}</div></div>`;
  } catch (e) { C.innerHTML = errBox(e.message); }
}
function filterMyDocs() {
  const q = document.getElementById('md-q').value.toLowerCase();
  const type = document.getElementById('md-type').value;
  const status = document.getElementById('md-status').value;
  let d = window._myDocs || [];
  if (q) d = d.filter(x => x.doc_number.toLowerCase().includes(q) || x.subject.toLowerCase().includes(q));
  if (type) d = d.filter(x => x.doc_type === type);
  if (status) d = d.filter(x => x.status === status);
  document.getElementById('md-table').innerHTML = docsTable(d);
}
function docsTable(docs) {
  if (!docs.length) return empty('📭', 'No documents found');
  return `<table><thead><tr><th>Doc No.</th><th>Type</th><th>Subject</th><th>Received</th><th>Status</th><th>Days Held</th><th>Actions</th></tr></thead>
    <tbody>${docs.map(d => `<tr>
      <td><strong>${esc(d.doc_number)}</strong></td>
      <td>${typeBadge(d.doc_type)}</td>
      <td>${esc(d.subject)}</td>
      <td>${fmtDate(d.received_date)}</td>
      <td>${statusBadge(d.status)}</td>
      <td>${daysPill(d.days_with_holder)}</td>
      <td style="display:flex;gap:4px;flex-wrap:wrap">
        ${d.status === 'Active' && d.current_holder_id == currentUser.id
          ? `<button class="btn btn-primary btn-sm" onclick="showTransferModal(${d.id},'${esc(d.doc_number)}')">↗ Transfer</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="showDocDetail(${d.id})">View</button>
        ${d.status === 'Active' && (currentUser.role === 'admin' || d.current_holder_id == currentUser.id)
          ? `<button class="btn btn-warning btn-sm" onclick="closeDoc(${d.id})">Close</button>` : ''}
      </td></tr>`).join('')}
    </tbody></table>`;
}
async function closeDoc(id) {
  if (!confirm('Mark this document as Closed?')) return;
  try { await api('PUT', `/api/documents/${id}/status`, { status: 'Closed' }); showToast('Document closed'); renderMyDocs(); }
  catch (e) { showToast(e.message, 'error'); }
}

function fromWhomSelectHtml(selectId, otherId, wrapId, currentVal) {
  // Build section options; detect if currentVal matches a section or is "other"
  const sectionOpts = allSections.map(s => {
    const sel = currentVal === s.name ? 'selected' : '';
    return `<option value="${esc(s.name)}" ${sel}>${esc(s.name)}</option>`;
  }).join('');
  const isOther = currentVal && !allSections.find(s => s.name === currentVal);
  return `
    <select id="${selectId}" onchange="toggleFromWhomOther('${selectId}','${wrapId}')">
      <option value="">— Select section or Other —</option>
      ${sectionOpts}
      <option value="__other__" ${isOther ? 'selected' : ''}>Other (specify below)</option>
    </select>
    <div id="${wrapId}" style="margin-top:6px;display:${isOther ? 'block' : 'none'}">

             value="${esc(isOther ? currentVal : '')}">

function toggleFromWhomOther(selectId, wrapId) {
  const v = document.getElementById(selectId).value;
  document.getElementById(wrapId).style.display = (v === '__other__') ? 'block' : 'none';

function getFromWhom(selectId, otherId) {
  const v = document.getElementById(selectId).value;
  if (!v) return null;
  if (v === '__other__') return document.getElementById(otherId).value.trim() || null;

}

async function showTransferModal(docId, docNo) {
  try {
    const recipients = await api('GET', '/api/users/recipients');
    if (!recipients.length) {
      openModal(`Transfer: ${docNo}`,
        `<div class="alert alert-error">
          <strong>No recipients available.</strong><br>
          There are no other users to transfer to. Please go to <strong>Users</strong> in the left menu and create user accounts first.
        </div>`,
        `<button class="btn btn-outline" onclick="closeModal()">Close</button>
         <button class="btn btn-primary" onclick="closeModal();navigate('users')">Go to User Management</button>`
      );
      return;
    }
    // Group by section for easier reading
    const groups = {};
    recipients.forEach(u => {
      const sec = u.section_name || 'Admin';
      if (!groups[sec]) groups[sec] = [];
      groups[sec].push(u);
    });
    const roleLabel = r => r === 'admin' ? 'Admin' : r === 'head' ? 'Head' : 'Staff';
    const opts = Object.entries(groups).map(([sec, users]) =>
      `<optgroup label="${esc(sec)}">${users.map(u =>
        `<option value="${u.id}">${esc(u.name)} (${roleLabel(u.role)})</option>`
      ).join('')}</optgroup>`
    ).join('');
    const isReceive = currentUserIsReceive();
    const hint = (isReceive || currentUser.role === 'admin')
      ? '<p style="font-size:12px;color:var(--muted);margin-bottom:12px">You can route this document to <strong>any user in any section</strong>.</p>'
      : currentUser.role === 'head'
        ? '<p style="font-size:12px;color:var(--muted);margin-bottom:12px">You can transfer to anyone in your section or any Section Head.</p>'
        : '<p style="font-size:12px;color:var(--muted);margin-bottom:12px">You can only forward to your Section Head.</p>';
    const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
    openModal(`Transfer: ${docNo}`,
      `${hint}<div class="form-group"><label>Transfer To *</label>
        <select id="tr-to" style="width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px">
          <option value="">Select recipient...</option>${opts}
        </select></div>
       <div class="form-group"><label>Date &amp; Time of Forwarding *</label>
        <input type="datetime-local" id="tr-date" value="${nowLocal}" max="${nowLocal}"
          style="width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px"></div>
       <div class="form-group"><label>Remarks</label>
        <textarea id="tr-rem" style="width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;min-height:70px;resize:vertical;font-family:inherit" placeholder="Optional..."></textarea></div>
       <div id="tr-err" class="alert alert-error" style="display:none"></div>`,
      `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="doTransfer(${docId})">↗ Transfer</button>`
    );
  } catch (e) { showToast(e.message, 'error'); }
}
async function doTransfer(docId) {
  const to_user_id = document.getElementById('tr-to').value;
  const forwarded_at = document.getElementById('tr-date').value;
  const remarks = document.getElementById('tr-rem').value.trim();
  const err = document.getElementById('tr-err');
  if (!to_user_id) { err.textContent = 'Please select a recipient.'; err.style.display = 'block'; return; }
  if (!forwarded_at) { err.textContent = 'Please enter the date & time of forwarding.'; err.style.display = 'block'; return; }
  try {
    await api('POST', `/api/documents/${docId}/transfer`, { to_user_id: parseInt(to_user_id), forwarded_at, remarks });
    closeModal(); showToast('Document transferred!'); renderDashboard();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}

function holdingDuration(fromDt, toDt) {
  if (!fromDt) return '';
  const ms = new Date(toDt || Date.now()) - new Date(fromDt);
  const days = Math.floor(ms / 86400000);
  const hrs  = Math.floor((ms % 86400000) / 3600000);
  if (days > 0) return `Held ${days} day${days>1?'s':''} ${hrs > 0 ? hrs+'h' : ''}`.trim();
  if (hrs > 0)  return `Held ${hrs} hr${hrs>1?'s':''}`;
  const mins = Math.floor((ms % 3600000) / 60000);
  return `Held ${mins > 0 ? mins+' min' : '<1 min'}`;
}

      return `
      <div class="trail-item">
        <div class="trail-dot"></div>
        <div>
          <div class="trail-action">${m.action}</div>

          </div>
          <div class="trail-detail" style="color:#9ca3af;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${fmtDT(m.created_at)}
            ${isLast
              ? `<span style="background:#fef3c7;color:#92400e;padding:1px 7px;border-radius:10px;font-size:11px">Currently holding · ${holdingDuration(m.created_at, null)}</span>`
              : duration ? `<span style="color:#6b7280;font-size:11px">· ${duration}</span>` : ''}
            ${currentUser.role==='admin' ? `<button class="btn btn-outline btn-sm" style="padding:1px 8px;font-size:11px" onclick="editMovement(${id},${m.id},'${m.created_at}')">✏️</button>` : ''}

        ${doc.ccc_forward_no ? `<div><span style="font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase">CCC Forward No</span><br>${esc(doc.ccc_forward_no)}</div>` : ''}

async function submitEditDoc(id) {
  const err = document.getElementById('ed-err');
  err.style.display='none';
  const body = {
    doc_number: document.getElementById('ed-no').value.trim(),
    doc_type:   document.getElementById('ed-type').value,
    subject:    document.getElementById('ed-sub').value.trim(),
    description:document.getElementById('ed-desc').value.trim()||null,
    received_date:document.getElementById('ed-date').value,
    ccc_forward_no:   document.getElementById('ed-fwd-no').value.trim()||null,
    ccc_forward_date: document.getElementById('ed-fwd-date').value||null,
    from_whom:        getFromWhom('ed-from-sel','ed-from-other'),
    contractor_consumer_name: document.getElementById('ed-contractor').value.trim()||null,
    status:     document.getElementById('ed-status').value,
    current_holder_id:  parseInt(document.getElementById('ed-holder').value)||null,
    current_section_id: parseInt(document.getElementById('ed-section').value)||null,
  };
  try {
    await api('PUT', `/api/documents/${id}`, body);
    closeModal(); showToast('Document updated!'); renderDashboard();
  } catch(e) { err.textContent=e.message; err.style.display='block'; }
}

async function submitEditMovement(docId, movId) {
  const err = document.getElementById('em-err');
  err.style.display='none';
  const created_at = document.getElementById('em-dt').value;
  const remarks    = document.getElementById('em-rem').value.trim()||undefined;

  } catch(e) { err.textContent=e.message; err.style.display='block'; }

async function doSearch() {
  const q = (document.getElementById('s-q') || {}).value || '';
  const type = (document.getElementById('s-type') || {}).value || '';
  const status = (document.getElementById('s-status') || {}).value || '';
  const sec = (document.getElementById('s-sec') || {}).value || '';
  const el = document.getElementById('sr');
  el.innerHTML = loading();
  try {
    let url = '/api/documents?';
    if (q) url += `search=${encodeURIComponent(q)}&`;
    if (type) url += `type=${encodeURIComponent(type)}&`;
    if (status) url += `status=${encodeURIComponent(status)}&`;
    if (sec) url += `section_id=${sec}&`;
    const docs = await api('GET', url);
    if (!docs.length) { el.innerHTML = empty('🔍', 'No documents found'); return; }
    el.innerHTML = `<div class="card">
      <div class="card-header"><h3>Results (${docs.length})</h3></div>
      <div class="table-wrapper"><table>
        <thead><tr><th>Doc No.</th><th>Type</th><th>Subject</th><th>Received</th><th>Holder</th><th>Section</th><th>Status</th><th>Days</th><th>Actions</th></tr></thead>
        <tbody>${docs.map(d => {
          const canRoute = d.status === 'Active' && (
            currentUser.role === 'admin' ||
            currentUser.role === 'head' ||
            currentUserIsReceive() ||
            d.current_holder_id === currentUser.id
          );
          return `<tr>
          <td><strong>${esc(d.doc_number)}</strong></td>
          <td>${typeBadge(d.doc_type)}</td>
          <td>${esc(d.subject)}</td>
          <td>${fmtDate(d.received_date)}</td>
          <td>${esc(d.holder_name || '–')}</td>
          <td>${esc(d.current_section_name || '–')}</td>
          <td>${statusBadge(d.status)}</td>
          <td>${daysPill(d.days_with_holder)}</td>
          <td style="white-space:nowrap">
            ${canRoute ? `<button class="btn btn-primary btn-sm" style="margin-right:4px" onclick="showTransferModal(${d.id},'${esc(d.doc_number)}')">↗ Route</button>` : ''}
            <button class="btn btn-outline btn-sm" onclick="showDocDetail(${d.id})">View</button>
          </td>
        </tr>`;}).join('')}
        </tbody></table></div></div>`;
  } catch (e) { el.innerHTML = errBox(e.message); }
}

// ── REPORTS ──────────────────────────────────────────────────────────────────
async function renderReports() {
  const C = document.getElementById('page-content');
  C.innerHTML = loading();
  try {
    const holdings = await api('GET', '/api/reports/holdings');
    const bySection = {};
    holdings.forEach(d => { const k = d.section_name || 'Unassigned'; (bySection[k] = bySection[k] || []).push(d); });
    const overdue = holdings.filter(d => d.days_with_holder >= 5).length;
    const warn = holdings.filter(d => d.days_with_holder >= 3 && d.days_with_holder < 5).length;
    const fresh = holdings.filter(d => d.days_with_holder <= 2).length;

    const secCards = Object.entries(bySection).map(([sec, docs]) => {
      const od = docs.filter(d => d.days_with_holder >= 5).length;
      return `<div class="card" style="margin-bottom:20px">
        <div class="card-header">
          <h3>📁 ${esc(sec)} <span class="badge badge-blue" style="margin-left:8px">${docs.length}</span>
          ${od > 0 ? `<span class="badge badge-red" style="margin-left:4px">⚠ ${od} overdue</span>` : ''}</h3>
        </div>
        <div class="table-wrapper"><table>
          <thead><tr><th>Doc No.</th><th>Type</th><th>Subject</th><th>Holder</th><th>Received</th><th>Days w/ Holder</th><th>Days Since Received</th><th></th></tr></thead>
          <tbody>${docs.map(d => `<tr>
            <td><strong>${esc(d.doc_number)}</strong></td>
            <td>${typeBadge(d.doc_type)}</td>
            <td>${esc(d.subject)}</td>
            <td>${esc(d.holder_name || '–')}</td>
            <td>${fmtDate(d.received_date)}</td>
            <td>${daysPill(d.days_with_holder)}</td>
            <td>${daysPill(d.days_with_holder)}</td>
            <td><button class="btn btn-outline btn-sm" onclick="showDocDetail(${d.id})">View</button></td>
          </tr>`).join('')}
          </tbody></table></div></div>`;
    }).join('');

    C.innerHTML = `
      <div class="stats-grid" style="margin-bottom:24px">
        <div class="stat-card blue"><div class="stat-label">Total Active</div><div class="stat-value">${holdings.length}</div><div class="stat-icon">📊</div></div>
        <div class="stat-card red"><div class="stat-label">Overdue (5+ days)</div><div class="stat-value">${overdue}</div><div class="stat-icon">🔴</div></div>
        <div class="stat-card orange"><div class="stat-label">Warning (3–4 days)</div><div class="stat-value">${warn}</div><div class="stat-icon">⚠️</div></div>
        <div class="stat-card green"><div class="stat-label">Fresh (0–2 days)</div><div class="stat-value">${fresh}</div><div class="stat-icon">✅</div></div>
      </div>
      ${secCards || empty('✅', 'No active documents')}`;
  } catch (e) { C.innerHTML = errBox(e.message); }
}

function showSectionModal(id, name) {
  const editing = !!id;
  openModal(editing ? 'Edit Section' : 'Add Section',
    `<div class="form-group">
      <label>Section Name *</label>
      <input id="sn-name" value="${name ? esc(name) : ''}" placeholder="e.g. HR Section"
        style="width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px">
    </div>
    <div id="sn-err" class="alert alert-error" style="display:none"></div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="submitSection(${id || 'null'})">${editing ? 'Save Changes' : 'Create'}</button>`
  );
  setTimeout(() => { const el = document.getElementById('sn-name'); if (el) el.focus(); }, 100);
}

async function submitSection(id) {
  const name = document.getElementById('sn-name').value.trim();
  const err  = document.getElementById('sn-err');
  err.style.display = 'none';
  if (!name) { err.textContent = 'Name is required.'; err.style.display = 'block'; return; }
  try {
    if (id) {
      await api('PUT',  `/api/sections/${id}`, { name });
      showToast('Section updated!');
    } else {
      await api('POST', '/api/sections', { name });
      showToast('Section created!');
    }
    closeModal();
    allSections = await api('GET', '/api/sections');
    renderSections();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}

async function deleteSection(id, name) {
  if (!confirm(`Delete section "${name}"?\n\nWill fail if active users or documents are linked to it.`)) return;
  try {
    await api('DELETE', `/api/sections/${id}`);
    showToast('Section deleted');
    allSections = await api('GET', '/api/sections');
    renderSections();
  } catch (e) { showToast(e.message, 'error'); }
}

const ACT_PAGE_SIZE = 15;
const _actPage = { movements: 1, ip: 1, sessions: 1 };
const _actData  = { movements: [], ip: [], sessions: [] };

function actPaginate(rows, tab) {
  const page  = _actPage[tab];
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / ACT_PAGE_SIZE));
  const start = (page - 1) * ACT_PAGE_SIZE;
  const slice = rows.slice(start, start + ACT_PAGE_SIZE);
  if (pages <= 1) return { slice, pgBar: '', total, start };
  let btns = '';
  for (let i = 1; i <= pages; i++) {
    btns += '<button class="btn btn-sm ' + (i===page?'btn-primary':'btn-outline') +
            '" data-tab="' + tab + '" data-p="' + i +
            '" onclick="setActPage(this.dataset.tab,+this.dataset.p)">' + i + '</button>';
  }
  const pgBar =
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);background:#f9fafb;font-size:13px">' +
      '<span style="color:var(--muted)">Showing ' + (start+1) + '–' + Math.min(start+ACT_PAGE_SIZE,total) + ' of ' + total + '</span>' +
      '<div style="display:flex;gap:6px">' +
        (page > 1 ? '<button class="btn btn-outline btn-sm" data-tab="' + tab + '" data-p="' + (page-1) + '" onclick="setActPage(this.dataset.tab,+this.dataset.p)">← Prev</button>' : '') +
        btns +
        (page < pages ? '<button class="btn btn-outline btn-sm" data-tab="' + tab + '" data-p="' + (page+1) + '" onclick="setActPage(this.dataset.tab,+this.dataset.p)">Next →</button>' : '') +
      '</div>' +
    '</div>';
  return { slice, pgBar, total, start };
}

function setActPage(tab, p) {
  _actPage[tab] = p;
  renderActTab(tab);
}

function renderActTab(tab) {

              '<td>' + esc(r.to_name || '–') + '<br><span style="font-size:11px;color:var(--muted)">' + esc(r.to_section || '') + '</span></td>' +

      '</tbody></table>' + pgBar + '</div>';

  } else if (tab === 'ip') {
    const aStyle = a => a==='login'?'badge-green':a==='logout'?'badge-gray':'badge-red';
    body.innerHTML = '<div style="background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden">' +
      '<table class="table"><thead><tr>' +
        '<th>Time</th><th>User</th><th>Section</th><th>Event</th><th>IP Address</th><th>Browser / Agent</th>' +
      '</tr></thead><tbody>' +
      (rows.length === 0
        ? '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">&#x1F4ED; No login events yet</td></tr>'
        : slice.map(r =>
            '<tr>' +
              '<td style="white-space:nowrap;font-size:12px">' + fmtDT(r.created_at) + '</td>' +
              '<td><strong>' + esc(r.user_name || r.username) + '</strong><br><code style="font-size:11px">' + esc(r.username) + '</code></td>' +
              '<td style="font-size:12px;color:var(--muted)">' + esc(r.section_name || '–') + '</td>' +
              '<td><span class="badge ' + aStyle(r.action) + '">' + esc(r.action) + '</span></td>' +
              '<td><code style="font-size:12px">' + esc(r.ip_address || '–') + '</code></td>' +
              '<td style="font-size:11px;color:var(--muted);max-width:220px;word-break:break-all">' + esc((r.user_agent||'–').substring(0,120)) + '</td>' +
            '</tr>'
          ).join('')) +
      '</tbody></table>' + pgBar + '</div>';

  } else if (tab === 'sessions') {
    body.innerHTML = '<div style="background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden">' +
      '<table class="table"><thead><tr>' +
        '<th>User</th><th>Section</th><th>Login Time</th><th>Logout Time</th><th>Duration</th><th>IP Address</th><th>Status</th>' +
      '</tr></thead><tbody>' +
      (rows.length === 0
        ? '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">&#x1F4ED; No sessions yet</td></tr>'
        : slice.map(r => {
            let dur = '–';
            if (r.logged_out_at) {
              const ms = new Date(r.logged_out_at) - new Date(r.logged_in_at);
              const m  = Math.round(ms / 60000);
              dur = m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + (m%60) + 'm';
            } else if (r.is_active) { dur = 'Active'; }
            return '<tr>' +
              '<td><strong>' + esc(r.user_name) + '</strong><br><code style="font-size:11px">' + esc(r.username) + '</code></td>' +

            '</tr>';

      '</tbody></table>' + pgBar + '</div>';

async function saveUser(id) {
  const err = document.getElementById('u-err');
  err.style.display = 'none';
  const payload = {
    name: document.getElementById('u-name').value.trim(),
    username: document.getElementById('u-username').value.trim(),
    role: document.getElementById('u-role').value,
    section_id: document.getElementById('u-section').value || null,
  };
  const pw = document.getElementById('u-password').value;
  if (pw) payload.password = pw;
  if (!payload.name || !payload.username || !payload.role) {
    err.textContent = 'Name, username and role are required.';
    err.style.display = 'block'; return;
  }
  if (!id && !pw) {
    err.textContent = 'Password is required for new users.';
    err.style.display = 'block'; return;
  }
  try {
    if (id) {
      await api('PUT', `/api/users/${id}`, payload);
      showToast('User updated!');
    } else {
      await api('POST', '/api/users', payload);
      showToast('User created!');
    }
    closeModal();
    renderUsers();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}

async function downloadBackup() {
  const btn = document.getElementById('btn-backup');
  const orig = btn ? btn.innerHTML : '';
  if (btn) { btn.innerHTML = '⏳ Preparing...'; btn.disabled = true; }
  try {
    const r = await fetch('/api/admin/backup', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      showToast(d.error || 'Backup failed', 'error');
      return;
    }
    const blob = await r.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'wbsedcl_backup_' + new Date().toISOString().slice(0,10) + '.db';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✅ Backup downloaded!');
  } catch (e) {
    showToast('Backup error: ' + e.message, 'error');
  } finally {
    if (btn) { btn.innerHTML = orig; btn.disabled = false; }
  }
}

async function doExport() {
  const from   = document.getElementById('exp-from').value;
  const to     = document.getElementById('exp-to').value;

  const types  = ['exp-notesheet','exp-bill','exp-letter']
    .filter(id => document.getElementById(id) && document.getElementById(id).checked)
    .map(id => document.getElementById(id).value);

  const btn = document.getElementById('exp-btn');
  const msg = document.getElementById('exp-msg');

  try {
    let url = '/api/export/documents?';
    if (from)   url += 'from_date=' + encodeURIComponent(from) + '&';
    if (to)     url += 'to_date='   + encodeURIComponent(to)   + '&';

}

function _trkQueryUrl(format) {
  const from  = document.getElementById('trk-from').value;
  const to    = document.getElementById('trk-to').value;
  const docno = (document.getElementById('trk-docno') || {}).value || '';
  const types = ['trk-notesheet','trk-bill','trk-letter']
    .filter(id => document.getElementById(id) && document.getElementById(id).checked)
    .map(id => document.getElementById(id).value);
  let url = '/api/export/movements?';
  if (from)   url += 'from_date=' + encodeURIComponent(from)  + '&';
  if (to)     url += 'to_date='   + encodeURIComponent(to)    + '&';
  if (docno)  url += 'doc_number='+ encodeURIComponent(docno) + '&';
  if (format) url += 'format='    + format + '&';
  types.forEach(t => { url += 'doc_type=' + encodeURIComponent(t) + '&'; });
  return url;
}

async function loadMovementTracker() {
  const types = ['trk-notesheet','trk-bill','trk-letter'].filter(id => document.getElementById(id) && document.getElementById(id).checked);
  if (types.length === 0) { showToast('Select at least one type', 'error'); return; }
  const el = document.getElementById('trk-results');
  el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Loading...</div>';
  const csvBtn = document.getElementById('trk-csv-btn');
  if (csvBtn) csvBtn.style.display = 'none';
  try {
    const r = await fetch(_trkQueryUrl(''), { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) { el.innerHTML = '<div style="color:red;padding:20px;">Failed to load data</div>'; return; }
    const rows = await r.json();
    if (!rows.length) { el.innerHTML = empty('🗺️','No movement data found for the selected filters'); return; }

    // Group by document
    const docs = {};
    const docOrder = [];
    rows.forEach(r => {
      if (!docs[r.doc_number]) { docs[r.doc_number] = []; docOrder.push(r.doc_number); }
      docs[r.doc_number].push(r);
    });

    let html = '';
    docOrder.forEach(dn => {
      const mvs = docs[dn];
      const first = mvs[0];
      html += '<div class="card" style="margin-bottom:16px;overflow:hidden;">';
      html += '<div class="card-header" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">';
      html += '<div><strong>' + esc(first.doc_number) + '</strong> &nbsp; ' + typeBadge(first.doc_type) + ' &nbsp; <span style="color:var(--text-muted);font-size:13px;">' + esc(first.subject) + '</span></div>';
      html += '<div>' + statusBadge(first.status) + ' &nbsp; <span style="font-size:12px;color:var(--text-muted);">Received: ' + fmtDate(first.received_date) + '</span></div>';
      html += '</div>';
      html += '<div class="table-wrapper"><table>';
      html += '<thead><tr><th>#</th><th>Action</th><th>From</th><th>To</th><th>Date &amp; Time</th><th>Time Held by Receiver</th><th>Remarks</th></tr></thead><tbody>';
      mvs.forEach(mv => {
        const isOngoing = mv.time_held && mv.time_held.includes('ongoing');
        html += '<tr>';
        html += '<td style="color:var(--text-muted);font-size:12px;">' + mv.move_no + '</td>';
        html += '<td><span style="font-size:12px;font-weight:600;color:#4f46e5;">' + esc(mv.action) + '</span></td>';
        html += '<td><div style="font-size:13px;">' + esc(mv.from_user) + '</div><div style="font-size:11px;color:var(--text-muted);">' + esc(mv.from_section) + '</div></td>';
        html += '<td><div style="font-size:13px;font-weight:600;">' + esc(mv.to_user) + '</div><div style="font-size:11px;color:var(--text-muted);">' + esc(mv.to_section) + '</div></td>';
        html += '<td style="font-size:12px;color:var(--text-muted);">' + esc(mv.moved_at) + '</td>';
        html += '<td><span style="font-size:12px;font-weight:600;color:' + (isOngoing ? '#f59e0b' : '#059669') + ';">' + esc(mv.time_held) + '</span></td>';
        html += '<td style="font-size:12px;color:var(--text-muted);">' + esc(mv.remarks || '') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
    });

    el.innerHTML = '<div style="margin-bottom:12px;color:var(--text-muted);font-size:13px;">' + docOrder.length + ' document(s) &middot; ' + rows.length + ' movement(s)</div>' + html;
    if (csvBtn) csvBtn.style.display = '';
  } catch(e) { el.innerHTML = '<div style="color:red;padding:20px;">Error: ' + e.message + '</div>'; }
}

// ── CONTRACTOR MANAGEMENT ────────────────────────────────────────────────────
let _contractorList = [];

async function loadContractorDropdown(selectId, selectedName) {
  try {
    const r = await fetch('/api/contractors', { headers: { 'Authorization': 'Bearer ' + token } });
    _contractorList = await r.json();
    const sel = document.getElementById(selectId);
    if (!sel) return;
    const prev = sel.value || selectedName || '';
    sel.innerHTML = '<option value="">-- Select Contractor / Consumer --</option>';
    _contractorList.filter(c => c.active).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      if (c.name === prev) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

async function renderContractors() {
  document.getElementById('page-content').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);">Loading...</div>';
  let rows = [];
  try {
    const r = await fetch('/api/contractors', { headers: { 'Authorization': 'Bearer ' + token } });
    rows = await r.json();
  } catch(e) { showToast('Failed to load contractors', 'error'); return; }

  document.getElementById('page-content').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <div>
      <h3 style="margin:0;font-size:1rem;font-weight:700;">${rows.length} Contractor(s) / Consumer(s)</h3>
      <p style="margin:4px 0 0;font-size:13px;color:var(--text-muted);">Names available in the Receive Document dropdown</p>
    </div>
    <button class="btn btn-primary" onclick="openAddContractor()">+ Add New</button>
  </div>
  <div class="card" style="padding:0;overflow:hidden;">
    <table class="table">
      <thead><tr><th>#</th><th>Name</th><th>Status</th><th>Added On</th><th>Actions</th></tr></thead>
      <tbody id="contractors-tbody">
      ${rows.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:32px;">No contractors yet. Click Add New to get started.</td></tr>' : ''}
      ${rows.map((c,i) => `
        <tr>
          <td>${i+1}</td>
          <td><strong>${esc(c.name)}</strong></td>
          <td><span class="badge ${c.active ? 'badge-success' : 'badge-danger'}">${c.active ? 'Active' : 'Inactive'}</span></td>
          <td style="color:var(--text-muted);font-size:13px;">${(c.created_at||'').slice(0,10)}</td>
          <td>
            <button class="btn btn-sm" style="margin-right:6px;" onclick="openEditContractor(${c.id},'${esc(c.name)}',${c.active})">Edit</button>
            <button class="btn btn-sm" style="background:#fee2e2;color:#dc2626;border-color:#fca5a5;" onclick="deleteContractor(${c.id},'${esc(c.name)}')">Delete</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  <div id="modal-contractor" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;">
    <div class="card" style="width:420px;padding:32px;position:relative;">
      <h3 id="ctr-modal-title" style="margin:0 0 20px;font-size:1.1rem;">Add Contractor</h3>
      <input type="hidden" id="ctr-edit-id" value="">
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input id="ctr-name" class="form-control" placeholder="Enter contractor or consumer name">
      </div>
      <div class="form-group" id="ctr-active-wrap">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="ctr-active" checked> Active (appears in dropdown)
        </label>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
        <button class="btn" onclick="closeContractorModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveContractor()">Save</button>
      </div>
    </div>
  </div>`;
}

function openAddContractor() {
  document.getElementById('ctr-modal-title').textContent = 'Add Contractor / Consumer';
  document.getElementById('ctr-edit-id').value = '';
  document.getElementById('ctr-name').value = '';
  document.getElementById('ctr-active').checked = true;
  document.getElementById('ctr-active-wrap').style.display = 'none';
  const m = document.getElementById('modal-contractor');
  if (m) { m.style.display = 'flex'; }
}

function openEditContractor(id, name, active) {
  document.getElementById('ctr-modal-title').textContent = 'Edit Contractor / Consumer';
  document.getElementById('ctr-edit-id').value = id;
  document.getElementById('ctr-name').value = name;
  document.getElementById('ctr-active').checked = !!active;
  document.getElementById('ctr-active-wrap').style.display = 'block';
  const m = document.getElementById('modal-contractor');
  if (m) { m.style.display = 'flex'; }
}

function closeContractorModal() {
  const m = document.getElementById('modal-contractor');
  if (m) m.style.display = 'none';
}

async function saveContractor() {
  const id   = document.getElementById('ctr-edit-id').value;
  const name = document.getElementById('ctr-name').value.trim();
  const active = document.getElementById('ctr-active').checked ? 1 : 0;
  if (!name) { showToast('Name is required', 'error'); return; }
  try {
    const method = id ? 'PUT' : 'POST';
    const url    = id ? '/api/contractors/' + id : '/api/contractors';
    const r = await fetch(url, {
      method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, active })
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Save failed', 'error'); return; }
    showToast(id ? 'Contractor updated!' : 'Contractor added!');
    closeContractorModal();
    renderContractors();
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

async function deleteContractor(id, name) {
  if (!confirm('Delete "' + name + '"? This only removes it from the dropdown — existing documents are not affected.')) return;
  try {
    const r = await fetch('/api/contractors/' + id, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!r.ok) { showToast('Delete failed', 'error'); return; }
    showToast('Deleted!');
    renderContractors();
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

</script>
</body>
</html>
